# Manual: find which Gemini models answer quickly right now.
name: Probe reader models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/probe-models.mjs]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase@12.5.0
      - run: node tools/probe-models.mjs
