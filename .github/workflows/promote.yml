# Owner's view: a new version waits in preview/ until the owner OKs it in the app. This checks every few minutes
# and, once it's OK'd, puts it live for admins, employees and customers, then applies any waiting data changes.
name: Put the owner's OK'd version live

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency: promote

permissions:
  contents: write
  pages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Load the Firebase key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::The FIREBASE_SERVICE_ACCOUNT secret is missing."; exit 1; fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/firebase-key.json"
      - name: Install the Firebase admin library
        run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Check for the owner's OK
        id: check
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: node tools/promote.js
      - name: Put it live
        if: steps.check.outputs.promote != ''
        run: |
          git config user.name "Gitty's Kitchen"
          git config user.email "actions@users.noreply.github.com"
          git add index.html version.json sw.js
          git commit -m "Owner OK'd version ${{ steps.check.outputs.promote }}: now live"
          git push
      - name: Apply data changes that came with it
        if: steps.check.outputs.promote != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: node data-changes/run.js
      - name: Publish the site
        if: steps.check.outputs.promote != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json"
